name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beauty
          POSTGRES_PASSWORD: beauty
          POSTGRES_DB: beauty_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beauty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://beauty:beauty@localhost:5432/beauty_test
      TEST_DATABASE_URL: postgresql://beauty:beauty@localhost:5432/beauty_test
      JWT_SECRET: ci-jwt-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Fails when a /api/master/* or /api/salon/* endpoint has no isolation test.
      - name: Tenant isolation tests
        run: pnpm check:isolation
      - name: All tests
        run: pnpm test
      - name: Build
        run: pnpm build
